<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="site-title-tag">lifeflim blog</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
        }
        .header-container {
            max-width: 1100px; margin: 0 auto; padding: 16px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 1.4rem; font-weight: 800; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 10px; letter-spacing: -0.5px; }
        .logo-img { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; }
        .logo-icon-default { width: 32px; height: 32px; background: var(--primary); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-size: 1rem; }

        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .view-section { display: none; }
        .view-section.active { display: block; }

        .hero {
            text-align: center; padding: 50px 20px; background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
            border-radius: var(--radius); margin-bottom: 30px; border: 1px solid #c7d2fe;
        }
        .hero h2 { font-size: 2.2rem; margin-bottom: 12px; color: #1e1b4b; font-weight: 800; }
        .hero p { color: #4338ca; font-size: 1.05rem; }

        .stats-bar {
            display: flex; justify-content: center; gap: 20px; margin-top: 15px; font-size: 0.85rem; font-weight: 700; color: #4f46e5;
        }
        .stat-item { background: white; padding: 4px 12px; border-radius: 20px; border: 1px solid #c7d2fe; }

        /* 동적 레이아웃 모드 CSS */
        .posts-container.mode-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px;
        }
        .posts-container.mode-single {
            display: flex; flex-direction: column; gap: 30px; max-width: 800px; margin: 0 auto;
        }
        .posts-container.mode-list {
            display: flex; flex-direction: column; gap: 12px; max-width: 900px; margin: 0 auto;
        }

        .post-card {
            background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border);
            overflow: hidden; box-shadow: var(--shadow); transition: transform 0.2s, box-shadow 0.2s;
            display: flex; flex-direction: column; cursor: pointer;
        }
        .post-card:hover { transform: translateY(-3px); box-shadow: 0 12px 24px -4px rgba(0,0,0,0.08); }
        .card-body { padding: 24px; flex-grow: 1; display: flex; flex-direction: column; }
        .card-tag { font-size: 0.75rem; font-weight: 700; color: var(--primary); text-transform: uppercase; margin-bottom: 8px; }
        .card-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 10px; color: var(--text-main); line-height: 1.4; }
        .card-preview { font-size: 0.92rem; color: var(--text-sub); margin-bottom: 20px; flex-grow: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .card-footer { font-size: 0.8rem; color: #94a3b8; border-top: 1px solid #f1f5f9; padding-top: 12px; display: flex; justify-content: space-between; }

        .mode-list .post-card { flex-direction: row; align-items: center; justify-content: space-between; padding: 16px 20px; }
        .mode-list .card-body { padding: 0; flex-direction: row; justify-content: space-between; width: 100%; align-items: center; }
        .mode-list .card-preview, .mode-list .card-tag { display: none; }
        .mode-list .card-title { margin-bottom: 0; font-size: 1.05rem; }
        .mode-list .card-footer { border-top: none; padding-top: 0; }

        .btn {
            padding: 10px 18px; border-radius: 8px; font-size: 0.9rem; font-weight: 600;
            border: none; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: #e2e8f0; color: #475569; }
        .btn-secondary:hover { background: #cbd5e1; }
        .btn-danger { background: #fee2e2; color: #dc2626; }
        .btn-danger:hover { background: #fecaca; }

        .editor-container { background: white; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; }
        .editor-header { padding: 20px 25px; border-bottom: 1px solid var(--border); background: #fafafa; }
        .editor-title-input { width: 100%; border: none; background: transparent; font-size: 1.8rem; font-weight: 800; outline: none; color: var(--text-main); }

        .toolbar { background: #ffffff; border-bottom: 1px solid var(--border); padding: 10px 15px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; position: sticky; top: 65px; z-index: 10; }
        .tb-group { display: flex; align-items: center; gap: 4px; border-right: 1px solid var(--border); padding-right: 8px; margin-right: 4px; }
        .tb-btn { background: none; border: 1px solid transparent; border-radius: 6px; padding: 6px 10px; font-size: 0.88rem; font-weight: 600; cursor: pointer; color: #475569; }
        .tb-btn:hover { background: #f1f5f9; color: var(--primary); }

        .editor-content { min-height: 450px; padding: 30px; outline: none; font-size: 1.05rem; line-height: 1.8; color: #334155; }
        .editor-content img { max-width: 100%; border-radius: 8px; margin: 15px 0; }

        .single-post { background: white; padding: 40px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); }
        .single-post h1 { font-size: 2.2rem; margin-bottom: 15px; border-bottom: 2px solid var(--border); padding-bottom: 15px; }

        /* 텐핑 광고 박스 스타일 */
        .tenping-ad-box { margin: 25px 0; text-align: center; background: #fafafa; padding: 10px; border-radius: 8px; border: 1px dashed #cbd5e1; }

        .comments-section { margin-top: 40px; border-top: 2px solid var(--border); padding-top: 30px; }
        .comment-form { background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 30px; }
        .form-row { display: flex; gap: 10px; margin-bottom: 12px; }
        .form-input { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; outline: none; background: white; flex: 1; }
        .comment-textarea { width: 100%; height: 80px; padding: 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; outline: none; resize: vertical; margin-bottom: 12px; font-family: inherit; }
        
        .comment-list { display: flex; flex-direction: column; gap: 15px; }
        .comment-item { background: #ffffff; border: 1px solid var(--border); border-radius: 8px; padding: 16px; }

        .admin-dashboard { background: white; padding: 30px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); }
        .admin-section-box { background: #f8fafc; padding: 20px; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 25px; }
        .admin-section-box h3 { margin-bottom: 15px; font-size: 1.1rem; color: var(--text-main); display: flex; align-items: center; gap: 8px; }

        .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .admin-card { background: white; padding: 16px; border-radius: 8px; border: 1px solid var(--border); text-align: center; }
        .admin-card h4 { color: var(--text-sub); font-size: 0.85rem; margin-bottom: 6px; }
        .admin-card .number { font-size: 1.6rem; font-weight: 800; color: var(--primary); }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.88rem; font-weight: 700; margin-bottom: 6px; color: #334155; }
        .form-group input[type="text"], .form-group textarea, .form-group select {
            width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; outline: none; background: white;
        }

        .admin-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.88rem; }
        .admin-table th, .admin-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
        .admin-table th { background: #f1f5f9; color: var(--text-sub); font-weight: 700; }

        @media (max-width: 768px) {
            .hero h2 { font-size: 1.6rem; }
            .editor-content, .single-post { padding: 20px; }
            .form-row { flex-direction: column; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <a href="#" class="logo" onclick="switchView('list')">
                <span id="header-logo-icon"><span class="logo-icon-default">🎬</span></span>
                <span id="header-blog-name">lifeflim blog</span>
            </a>
            <div id="nav-btn-area"></div>
        </div>
    </header>

    <div class="container">
        <!-- 1. 메인 포스트 목록 및 방문자 통계 화면 -->
        <section id="view-list" class="view-section active">
            <div class="hero">
                <h2 id="hero-title">lifeflim blog</h2>
                <p id="hero-desc">일상의 순간들과 지식을 한 편의 필름처럼 기록하는 블로그입니다.</p>
                <div class="stats-bar">
                    <span class="stat-item">Today: <b id="stat-today">0</b></span>
                    <span class="stat-item">Total: <b id="stat-total">0</b></span>
                </div>
            </div>
            <div id="posts-container" class="posts-container mode-grid"></div>
        </section>

        <!-- 2. 에디터 화면 (관리자 전용) -->
        <section id="view-write" class="view-section">
            <div class="editor-container">
                <div class="editor-header">
                    <input type="text" id="post-title-input" class="editor-title-input" placeholder="제목을 입력하세요">
                </div>

                <div class="toolbar">
                    <div class="tb-group">
                        <select class="tb-select" onchange="execCmd('formatBlock', this.value)">
                            <option value="P">본문 (기본)</option>
                            <option value="H1">제목 1 (H1)</option>
                            <option value="H2">제목 2 (H2)</option>
                        </select>
                    </div>

                    <div class="tb-group">
                        <button class="tb-btn" onclick="execCmd('bold')"><b>B</b></button>
                        <button class="tb-btn" onclick="execCmd('italic')"><i>I</i></button>
                        <button class="tb-btn" onclick="execCmd('underline')"><u>U</u></button>
                    </div>

                    <div class="tb-group">
                        <label class="tb-btn" style="cursor:pointer;">
                            🖼️ 이미지
                            <input type="file" accept="image/*" style="display:none;" onchange="insertImage(event)">
                        </label>
                    </div>
                </div>

                <div id="editor-body" class="editor-content" contenteditable="true" placeholder="내용을 입력하세요..."></div>

                <div style="padding: 20px 25px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px;">
                    <button class="btn btn-secondary" onclick="switchView('list')">취소</button>
                    <button class="btn btn-primary" onclick="savePost()">발행하기</button>
                </div>
            </div>
        </section>

        <!-- 3. 포스트 상세 페이지 -->
        <section id="view-single" class="view-section">
            <div class="single-post">
                <h1 id="single-title"></h1>
                <div style="color:var(--text-sub); font-size:0.9rem; margin-bottom:20px;" id="single-meta"></div>

                <!-- 📢 [텐핑 상단 광고] -->
                <div class="tenping-ad-box">
                    <tenping class="adsbytenping" style="width:100%;max-width:768px;margin:0px auto;display:block;" tenping-ad-display-type="1LawCE8FqKOhetXZhMopsQ%3d%3d" tenping-ad-client="7XI60k1zpb7jDgfx5mCBKT3lw2YWWVa57kAb0xO4SrmcbS%2budhYBGDXu6Emhi7IJ"></tenping>
                    <script async src="//ads.tenping.kr/scripts/adsbytenping.min.js"></script>
                </div>

                <div id="single-content" class="editor-content" style="padding: 0;"></div>

                <!-- 📢 [텐핑 하단 광고] -->
                <div class="tenping-ad-box">
                    <tenping class="adsbytenping" style="width:100%;max-width:768px;margin:0px auto;display:block;" tenping-ad-display-type="1LawCE8FqKOhetXZhMopsQ%3d%3d" tenping-ad-client="7XI60k1zpb7jDgfx5mCBKT3lw2YWWVa57kAb0xO4SrmcbS%2budhYBGDXu6Emhi7IJ"></tenping>
                    <script async src="//ads.tenping.kr/scripts/adsbytenping.min.js"></script>
                </div>

                <div class="comments-section">
                    <h3>💬 댓글 (<span id="comment-count">0</span>)</h3>
                    
                    <div class="comment-form">
                        <div class="form-row">
                            <input type="text" id="comment-author" class="form-input" placeholder="닉네임 (익명)" maxlength="20">
                            <input type="password" id="comment-pw" class="form-input" placeholder="삭제 비밀번호" maxlength="20">
                        </div>
                        <textarea id="comment-body" class="comment-textarea" placeholder="따뜻한 한마디를 남겨주세요..."></textarea>
                        <div style="display:flex; justify-content:flex-end;">
                            <button class="btn btn-primary" onclick="submitComment()">댓글 등록</button>
                        </div>
                    </div>

                    <div class="comment-list" id="comment-list-container"></div>
                </div>

                <div style="margin-top: 30px;">
                    <button class="btn btn-secondary" onclick="switchView('list')">⬅️ 목록으로 돌아가기</button>
                </div>
            </div>
        </section>

        <!-- 4. 관리자 통합 설정 페이지 -->
        <section id="view-admin" class="view-section">
            <div class="admin-dashboard">
                <h2 style="margin-bottom:25px; color:var(--text-main);">⚙️ 관리자 대시보드 및 블로그 관리</h2>

                <div class="admin-grid">
                    <div class="admin-card">
                        <h4>오늘 방문자</h4>
                        <div class="number" id="adm-stat-today">0</div>
                    </div>
                    <div class="admin-card">
                        <h4>누적 방문자</h4>
                        <div class="number" id="adm-stat-total">0</div>
                    </div>
                    <div class="admin-card">
                        <h4>전체 포스트</h4>
                        <div class="number" id="adm-stat-posts">0</div>
                    </div>
                </div>

                <div class="admin-section-box">
                    <h3>🖼️ 블로그 이름 & 로고 설정</h3>
                    <div class="form-group">
                        <label>블로그 이름</label>
                        <input type="text" id="adm-input-blogname" placeholder="블로그 이름 입력">
                    </div>
                    <div class="form-group">
                        <label>메인 소개글</label>
                        <textarea id="adm-input-blogdesc" rows="2" placeholder="블로그 메인 타이틀 아래에 표시되는 설명"></textarea>
                    </div>
                    <div class="form-group">
                        <label>블로그 커스텀 로고 이미지</label>
                        <input type="file" accept="image/*" onchange="uploadLogoImage(event)">
                        <div id="adm-logo-preview" style="margin-top:10px;"></div>
                    </div>
                    <button class="btn btn-primary" onclick="saveBlogSettings()">기본 설정 저장하기</button>
                </div>

                <div class="admin-section-box">
                    <h3>📐 레이아웃 스타일 설정</h3>
                    <div class="form-group">
                        <label>메인 화면 포스트 나열 방식</label>
                        <select id="adm-select-layout" onchange="changeLayoutMode(this.value)">
                            <option value="mode-grid">카드 그리드형 (3열 반응형 기본)</option>
                            <option value="mode-single">싱글 와이드형 (피드 스타일 1열)</option>
                            <option value="mode-list">컴팩트 리스트형 (목록 위주)</option>
                        </select>
                    </div>
                </div>

                <div class="admin-section-box" style="background:#eef2ff; border-color:#c7d2fe;">
                    <h3>💾 백업 & 복구 센터</h3>
                    <p style="font-size:0.85rem; color:#4338ca; margin-bottom:15px;">포스트, 댓글, 레이아웃 및 로고 설정값이 모두 포함된 데이터 파일입니다.</p>
                    <div style="display:flex; gap:10px; flex-wrap:wrap;">
                        <button class="btn btn-primary" onclick="generateDynamicBackup()">📥 암호화 백업 파일 다운로드</button>
                        <label class="btn btn-secondary" style="cursor:pointer;">
                            📤 백업 파일 복원
                            <input type="file" accept=".json" onchange="restoreBackup(event)" style="display:none;">
                        </label>
                    </div>
                </div>

                <div class="admin-section-box">
                    <h3>💬 전체 댓글 강제 관리</h3>
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>작성자</th>
                                <th>내용</th>
                                <th>작성일시</th>
                                <th>관리</th>
                            </tr>
                        </thead>
                        <tbody id="admin-comments-table"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>

    <script>
        const defaultPosts = [
            {
                id: 1,
                title: "lifeflim blog 첫 번째 이야기",
                content: "<p><b>lifeflim blog</b>에 오신 것을 환영합니다! 일상의 순간들을 기록하는 블로그입니다.</p>",
                date: "2026-08-29",
                preview: "lifeflim blog에 오신 것을 환영합니다!",
                comments: []
            }
        ];

        let blogConfig = JSON.parse(localStorage.getItem('lifeflim_config')) || {
            name: "lifeflim blog",
            desc: "일상의 순간들과 지식을 한 편의 필름처럼 기록하는 블로그입니다.",
            logo: null,
            layout: "mode-grid"
        };

        let posts = JSON.parse(localStorage.getItem('lifeflim_blog_posts')) || defaultPosts;
        let adminPassword = localStorage.getItem('lifeflim_admin_pw') || 'admin1234';
        let isAdminLoggedIn = sessionStorage.getItem('lifeflim_admin_login') === 'true';
        let activePostId = null;

        function applyBlogConfig() {
            document.title = blogConfig.name;
            document.getElementById('site-title-tag').innerText = blogConfig.name;
            document.getElementById('header-blog-name').innerText = blogConfig.name;
            document.getElementById('hero-title').innerText = blogConfig.name;
            document.getElementById('hero-desc').innerText = blogConfig.desc;

            const logoIconBox = document.getElementById('header-logo-icon');
            if (blogConfig.logo) {
                logoIconBox.innerHTML = `<img src="${blogConfig.logo}" class="logo-img" alt="logo">`;
            } else {
                logoIconBox.innerHTML = `<span class="logo-icon-default">🎬</span>`;
            }

            const postsBox = document.getElementById('posts-container');
            postsBox.className = `posts-container ${blogConfig.layout}`;

            document.getElementById('adm-input-blogname').value = blogConfig.name;
            document.getElementById('adm-input-blogdesc').value = blogConfig.desc;
            document.getElementById('adm-select-layout').value = blogConfig.layout;
            if (blogConfig.logo) {
                document.getElementById('adm-logo-preview').innerHTML = `<img src="${blogConfig.logo}" style="max-height:50px; border-radius:6px;">`;
            }
        }

        function saveBlogSettings() {
            blogConfig.name = document.getElementById('adm-input-blogname').value.trim() || 'lifeflim blog';
            blogConfig.desc = document.getElementById('adm-input-blogdesc').value.trim();
            localStorage.setItem('lifeflim_config', JSON.stringify(blogConfig));
            applyBlogConfig();
            alert('블로그 기본 설정이 저장되었습니다.');
        }

        function uploadLogoImage(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                blogConfig.logo = evt.target.result;
                localStorage.setItem('lifeflim_config', JSON.stringify(blogConfig));
                applyBlogConfig();
                alert('로고 이미지가 변경되었습니다.');
            };
            reader.readAsDataURL(file);
        }

        function changeLayoutMode(newMode) {
            blogConfig.layout = newMode;
            localStorage.setItem('lifeflim_config', JSON.stringify(blogConfig));
            applyBlogConfig();
        }

        function initVisitorStats() {
            let stats = JSON.parse(localStorage.getItem('lifeflim_stats')) || { today: 0, total: 0, lastDate: "" };
            const todayStr = new Date().toISOString().slice(0, 10);

            if (stats.lastDate !== todayStr) {
                stats.today = 1;
                stats.lastDate = todayStr;
            } else {
                if (!sessionStorage.getItem('lifeflim_visited')) {
                    stats.today += 1;
                    stats.total += 1;
                    sessionStorage.setItem('lifeflim_visited', 'true');
                }
            }

            localStorage.setItem('lifeflim_stats', JSON.stringify(stats));
            document.getElementById('stat-today').innerText = stats.today;
            document.getElementById('stat-total').innerText = stats.total;
            document.getElementById('adm-stat-today').innerText = stats.today;
            document.getElementById('adm-stat-total').innerText = stats.total;
        }

        function generateDynamicBackup() {
            const dynamicKey = Math.random().toString(36).substring(2, 10).toUpperCase();
            
            const backupData = {
                exportDate: new Date().toISOString(),
                securityKey: dynamicKey,
                config: blogConfig,
                posts: posts,
                stats: JSON.parse(localStorage.getItem('lifeflim_stats'))
            };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `lifeflim_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();

            alert(`🎉 백업 파일 다운로드 완료!\n🔑 보안 복원 키: [ ${dynamicKey} ]`);
        }

        function restoreBackup(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    const inputKey = prompt(`🔐 백업 파일 보안 키를 입력하세요:\n(발급 키: ${imported.securityKey || '없음'})`);

                    if (imported.securityKey && inputKey !== imported.securityKey) {
                        return alert('보안 키가 올바르지 않습니다.');
                    }

                    if (imported.posts) {
                        posts = imported.posts;
                        if (imported.config) blogConfig = imported.config;
                        localStorage.setItem('lifeflim_blog_posts', JSON.stringify(posts));
                        localStorage.setItem('lifeflim_config', JSON.stringify(blogConfig));
                        alert('성공적으로 모든 데이터와 설정이 복원되었습니다.');
                        location.reload();
                    }
                } catch (err) {
                    alert('유효한 백업 파일이 아닙니다.');
                }
            };
            reader.readAsText(file);
        }

        function updateHeaderNav() {
            const navArea = document.getElementById('nav-btn-area');
            if (isAdminLoggedIn) {
                navArea.innerHTML = `
                    <button class="btn btn-secondary" onclick="switchView('list')">글 목록</button>
                    <button class="btn btn-primary" onclick="switchView('write')">✍️ 글쓰기</button>
                    <button class="btn btn-secondary" onclick="switchView('admin')">⚙️ 관리자</button>
                    <button class="btn btn-secondary" onclick="adminLogout()">🔒 로그아웃</button>
                `;
            } else {
                navArea.innerHTML = `
                    <button class="btn btn-secondary" onclick="switchView('list')">글 목록</button>
                    <button class="btn btn-primary" onclick="tryAdminLogin()">✍️ 글쓰기</button>
                `;
            }
        }

        function tryAdminLogin() {
            const inputPw = prompt('🔒 관리자 비밀번호를 입력하세요:');
            if (inputPw === adminPassword) {
                isAdminLoggedIn = true;
                sessionStorage.setItem('lifeflim_admin_login', 'true');
                alert('관리자 로그인 완료');
                updateHeaderNav();
                switchView('write');
            } else if (inputPw !== null) {
                alert('비밀번호가 일치하지 않습니다.');
            }
        }

        function adminLogout() {
            isAdminLoggedIn = false;
            sessionStorage.removeItem('lifeflim_admin_login');
            updateHeaderNav();
            switchView('list');
        }

        function renderAdminDashboard() {
            document.getElementById('adm-stat-posts').innerText = posts.length;
            const tbody = document.getElementById('admin-comments-table');
            tbody.innerHTML = '';

            posts.forEach(post => {
                (post.comments || []).forEach(comment => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><b>${escapeHTML(comment.author)}</b></td>
                        <td>${escapeHTML(comment.body)}</td>
                        <td>${comment.date}</td>
                        <td><button class="btn btn-danger" style="padding:2px 8px; font-size:0.75rem;" onclick="adminForceDeleteComment(${post.id}, ${comment.id})">삭제</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            });

            if (tbody.innerHTML === '') {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--text-sub);">등록된 댓글이 없습니다.</td></tr>';
            }
        }

        function adminForceDeleteComment(postId, commentId) {
            if (!confirm('댓글을 삭제하시겠습니까?')) return;
            const pIdx = posts.findIndex(p => p.id === postId);
            if (pIdx !== -1) {
                posts[pIdx].comments = posts[pIdx].comments.filter(c => c.id !== commentId);
                localStorage.setItem('lifeflim_blog_posts', JSON.stringify(posts));
                renderAdminDashboard();
            }
        }

        function execCmd(cmd, val = null) { document.execCommand(cmd, false, val); }

        function insertImage(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => execCmd('insertImage', evt.target.result);
            reader.readAsDataURL(file);
        }

        function savePost() {
            const title = document.getElementById('post-title-input').value.trim();
            const content = document.getElementById('editor-body').innerHTML.trim();
            if (!title || !content) return alert('제목과 내용을 입력하세요.');

            posts.unshift({
                id: Date.now(),
                title: title,
                content: content,
                preview: document.getElementById('editor-body').innerText.slice(0, 100) + '...',
                date: new Date().toISOString().slice(0, 10),
                comments: []
            });

            localStorage.setItem('lifeflim_blog_posts', JSON.stringify(posts));
            document.getElementById('post-title-input').value = '';
            document.getElementById('editor-body').innerHTML = '';
            switchView('list');
        }

        function switchView(view, postId = null) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            if (view === 'list') {
                renderPostList();
                document.getElementById('view-list').classList.add('active');
            } else if (view === 'write') {
                if (!isAdminLoggedIn) return tryAdminLogin();
                document.getElementById('view-write').classList.add('active');
            } else if (view === 'admin') {
                if (!isAdminLoggedIn) return tryAdminLogin();
                renderAdminDashboard();
                document.getElementById('view-admin').classList.add('active');
            } else if (view === 'single' && postId) {
                activePostId = postId;
                renderSinglePost(postId);
                document.getElementById('view-single').classList.add('active');
            }
        }

        function renderPostList() {
            const container = document.getElementById('posts-container');
            container.innerHTML = '';
            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.onclick = () => switchView('single', post.id);
                card.innerHTML = `
                    <div class="card-body">
                        <div class="card-tag">LIFEFLIM</div>
                        <h3 class="card-title">${escapeHTML(post.title)}</h3>
                        <p class="card-preview">${escapeHTML(post.preview)}</p>
                        <div class="card-footer">
                            <span>📅 ${post.date}</span>
                            <span>💬 댓글 ${(post.comments || []).length}개</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderSinglePost(postId) {
            const post = posts.find(p => p.id === postId);
            if (!post) return;
            document.getElementById('single-title').innerText = post.title;
            document.getElementById('single-meta').innerText = `발행일: ${post.date}`;
            document.getElementById('single-content').innerHTML = post.content;
            renderComments(post);
        }

        function renderComments(post) {
            const comments = post.comments || [];
            document.getElementById('comment-count').innerText = comments.length;
            const container = document.getElementById('comment-list-container');
            container.innerHTML = '';
            comments.forEach(c => {
                const item = document.createElement('div');
                item.className = 'comment-item';
                item.innerHTML = `
                    <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                        <b>${escapeHTML(c.author)}</b>
                        <span style="font-size:0.8rem; color:var(--text-sub);">${c.date}</span>
                    </div>
                    <div>${escapeHTML(c.body)}</div>
                `;
                container.appendChild(item);
            });
        }

        function submitComment() {
            const author = document.getElementById('comment-author').value.trim() || '익명';
            const body = document.getElementById('comment-body').value.trim();
            if (!body) return alert('댓글 내용을 입력하세요.');

            const pIdx = posts.findIndex(p => p.id === activePostId);
            if (pIdx === -1) return;

            if (!posts[pIdx].comments) posts[pIdx].comments = [];
            posts[pIdx].comments.unshift({
                id: Date.now(),
                author: author,
                body: body,
                date: new Date().toLocaleString()
            });

            localStorage.setItem('lifeflim_blog_posts', JSON.stringify(posts));
            document.getElementById('comment-author').value = '';
            document.getElementById('comment-body').value = '';
            renderComments(posts[pIdx]);
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        applyBlogConfig();
        initVisitorStats();
        updateHeaderNav();
        renderPostList();
    </script>
</body>
</html>
